<!DOCTYPE html><html lang="en">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Find Teammates | Project Partner Finder</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="app-bg">
    <header class="simple-header">
      <a class="brand" href="index.html">Project
        <span>Partner</span> Finder</a>
      <nav><a href="profile.html">My profile</a>
        <a href="project.html">Post a project</a>
      </nav>
    </header><main class="content-wrap">
      <div class="section-heading left"><div class="eyebrow">YOUR NEXT TEAMMATE IS HERE</div>
        <h1>Find teammates</h1>
        <p>Search by skill or interest and discover students who could fit your team.</p>
      </div>
      <form id="searchForm" class="search-panel">
        <label>Skill or interest<input id="searchTerm" placeholder="e.g. Java, Python, Web Development"></label><label>Availability<select id="searchAvailability">
          <option value="">Any availability</option>
          <option>Weekdays</option>
          <option>Weekends</option>
          <option>Evenings</option>
          <option>Flexible</option>
        </select>
        </label>
        <button class="btn primary">Search</button>
      </form><div class="results-head">
        <h2>Recommended teammates</h2>
        <span class="muted">Sample profiles for prototype</span>
      </div>
      <div id="people" class="people-grid"></div>
      <div class="results-head">
        <h2>Open projects</h2>
      </div>
      <div id="projects" class="people-grid">
        
      </div></main><script src="app.js">
        
      </script>
  </body>
</html>
