<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Profile | Project Partner Finder</title>
  <link rel="stylesheet" href="style.css"></head>
  <body class="app-bg"><header class="simple-header">
    <a class="brand" href="index.html">Project<span>Partner</span> Finder
    </a><nav><a href="project.html">Post a project</a>
      <a href="find.html">Find teammates</a></nav></header><main class="form-wrap wide">
        <form class="panel" id="profileForm"><div class="eyebrow">YOUR TEAMMATE PROFILE</div>
          <h1>Create your profile</h1>
          <p class="muted">Help others understand what you bring to a team.</p>
          <div class="two-col">
            <label>Name<input id="profileName" required placeholder="Your name"></label>
            <label>Course<input id="course" required placeholder="e.g. B.Tech CSE"></label>
            <label>Year<select id="year"><option>1st Year</option>
              <option>2nd Year</option><option>3rd Year</option>
              <option>4th Year</option>
            </select>
            </label>
            <label>Availability<select id="availability">
              <option>Weekdays</option>
              <option>Weekends</option>
              <option>Evenings</option>
              <option>Flexible</option>
            </select>
            </label>
          </div><label>Skills <small>Separate with commas</small>
            <input id="skills" required placeholder="Java, Python, HTML, CSS"></label>
          <label>Interests <small>Separate with commas</small>
            <input id="interests" placeholder="AI, Web Development, Hackathons"></label>
          <label>About you<textarea id="about" rows="3" placeholder="What kind of projects would you like to work on?"></textarea>
          </label><button class="btn primary full">Save profile</button>
          <p class="notice" id="message"></p></form></main><script src="app.js">
            
          </script>
  </body>
</html>
