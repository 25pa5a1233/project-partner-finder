<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post a Project | Project Partner Finder</title><link rel="stylesheet" href="style.css"></head><body class="app-bg"><header class="simple-header"><a class="brand" href="index.html">Project<span>Partner</span> Finder</a><nav><a href="profile.html">Profile</a><a href="find.html">Find teammates</a></nav></header><main class="form-wrap wide"><form class="panel" id="projectForm"><div class="eyebrow">START SOMETHING GREAT</div><h1>Post a project</h1><p class="muted">Tell the community what you are building and who you need.</p><label>Project title<input id="projectTitle" required placeholder="e.g. Smart Student Collaboration Platform"></label><label>Project description<textarea id="projectDescription" required rows="4" placeholder="Describe your idea and goals"></textarea></label><label>Required skills <small>Separate with commas</small><input id="requiredSkills" required placeholder="Java, Python, UI/UX"></label><div class="two-col"><label>Team size<select id="teamSize"><option>2 Members</option><option selected>4 Members</option><option>5 Members</option><option>6 Members</option></select></label><label>Project deadline<input id="deadline" type="date"></label></div><button class="btn primary full">Publish project</button><p class="notice" id="message"></p></form></main><script src="app.js"></script></body></html>
