<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Project Partner Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
  <body class="app-bg">
    <header class="simple-header">
      <a class="brand" href="index.html">
        Project<span>Partner</span> Finder
      </a><a href="index.html">Home</a>
    </header>
    <main class="form-wrap">
      <form class="panel" id="loginForm">
        <div class="eyebrow">WELCOME BACK</div>
        <h1>Student Login</h1>
        <p class="muted">Continue finding your project team.</p>
        <label>Email<input type="email" id="email" required placeholder="you@example.com"></label>
        <label>Password<input type="password" id="password" required minlength="4" placeholder="Enter your password"></label>
        <button class="btn primary full">Login</button>
        <p class="form-foot">Don't have an account? <a href="signup.html">Sign up</a></p>
        <p class="notice" id="message"></p>
      </form>
    </main>
    <script src="app.js"></script>
  </body>
</html>
